kind = "web"
previewPath = "/"
title = "Xclusive Cuts Barbershop"
version = "1.0.0"
id = "artifacts/xclusive-cuts"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23098

[services.development]
run = "pnpm --filter @workspace/xclusive-cuts run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xclusive-cuts", "run", "build" ]
publicDir = "artifacts/xclusive-cuts/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23098"
BASE_PATH = "/"
